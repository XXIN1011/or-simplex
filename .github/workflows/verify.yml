# =============================================================================
#  质量门禁 —— push 与 PR 都跑一遍，绿了才算「改完」
#  ---------------------------------------------------------------------------
#  背景：以前这些验证全靠「读 HANDOFF 的 agent 记得手跑」，没有任何自动兜底。
#  这里把最重要的几条固化成门禁：
#    · 构建产物与源码一致（改了 src/ 忘了 npm run build 会被抓）
#    · 注册一致性 / 无 DP 残留
#    · 单元测试 + 8 套算法回归
#    · 无头 Chrome 的 UI 回归（runner 自带 google-chrome，lib/chrome.js 自动找得到）
#  scipy 对拍与无障碍检查均为必过门禁；已知求解器分歧由脚本复核并单独记录。
# =============================================================================
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建 + 产物一致性（忘记 npm run build 会在这里暴露）
        run: node src/build.js && git diff --exit-code -- index.html

      - name: 静态检查（注册一致性 / 无 DP 残留）
        run: |
          node tools/check-registry.js
          node tools/check-no-dp.js

      - name: 单元测试 + 算法回归
        run: node test/run-all.js

      - name: UI 回归（无头 Chrome）
        run: node test/ui/verify-ui.js --quiet

      - name: 无障碍 / 图解越界审查
        run: |
          node test/ui/audit.js --quiet
          node test/ui/audit.js 'index.html#/transport' --quiet
          node test/ui/audit.js 'index.html#/transport' dark --quiet
          node test/ui/graph-bounds.js --quiet

      - name: 失败时上传 UI 回归明细
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ui-log
          path: preview/logs/
          if-no-files-found: ignore

  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 numpy / scipy
        run: python -m pip install --quiet numpy==2.5.4 scipy==1.18.1

      # 顺序不能乱：对拍脚本读的题库 JSON 被 gitignore，必须先由 node 侧生成
      - name: 生成题库
        run: |
          node test/algorithm/test-simplex.js
          node test/algorithm/dual-test.js
          node test/algorithm/sens-test.js
          node test/algorithm/scenario-test.js
          node test/algorithm/param-test.js
          node test/algorithm/assignment-test.js
          node test/algorithm/transport-test.js

      - name: scipy 独立复算（七个对拍脚本）
        run: |
          python test/algorithm/crosscheck.py
          python test/algorithm/crosscheck-dual.py
          python test/algorithm/crosscheck-sens.py
          python test/algorithm/crosscheck-scenario.py
          python test/algorithm/crosscheck-param.py
          python test/algorithm/crosscheck-assign.py
          python test/algorithm/crosscheck-transport.py

      - name: 验证失败与空题库均返回非零退出码
        run: python test/algorithm/check-exitcodes.py
